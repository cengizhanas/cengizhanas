<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="360" y2="240">
      <stop stop-color="#083344"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="360" y2="240">
      <stop stop-color="#1A2E05"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="360" y2="240">
      <stop stop-color="#3B0764"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="pulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 01 Arcade -->
  <g transform="translate(20 20)">
    <rect width="360" height="240" rx="22" fill="url(#c1)" stroke="#164E63" stroke-width="2"/>
    <rect x="24" y="24" width="54" height="28" rx="8" fill="#22D3EE" opacity=".15" stroke="#22D3EE"/>
    <text x="51" y="44" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">01</text>
    <circle cx="300" cy="48" r="10" fill="#22D3EE" filter="url(#pulse)">
      <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="100" fill="#F8FAFC" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="800">Arcade</text>
    <text x="28" y="140" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      Reflex-first products.
    </text>
    <text x="28" y="168" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      Fast loops. Instant fun.
    </text>
    <text x="28" y="210" fill="#22D3EE" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">
      GAMES · INTERACTION
    </text>
  </g>

  <!-- 02 Systems -->
  <g transform="translate(420 20)">
    <rect width="360" height="240" rx="22" fill="url(#c2)" stroke="#3F6212" stroke-width="2"/>
    <rect x="24" y="24" width="54" height="28" rx="8" fill="#A3E635" opacity=".15" stroke="#A3E635"/>
    <text x="51" y="44" text-anchor="middle" fill="#BEF264" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">02</text>
    <circle cx="300" cy="48" r="10" fill="#A3E635" filter="url(#pulse)">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="100" fill="#F8FAFC" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="800">Systems</text>
    <text x="28" y="140" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      APIs, data, queues.
    </text>
    <text x="28" y="168" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      Clear boundaries. Scale.
    </text>
    <text x="28" y="210" fill="#A3E635" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">
      GO · BACKEND · CLOUD
    </text>
  </g>

  <!-- 03 Polish -->
  <g transform="translate(820 20)">
    <rect width="360" height="240" rx="22" fill="url(#c3)" stroke="#6B21A8" stroke-width="2"/>
    <rect x="24" y="24" width="54" height="28" rx="8" fill="#E879F9" opacity=".15" stroke="#E879F9"/>
    <text x="51" y="44" text-anchor="middle" fill="#F0ABFC" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">03</text>
    <circle cx="300" cy="48" r="10" fill="#E879F9" filter="url(#pulse)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="100" fill="#F8FAFC" font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="800">Polish</text>
    <text x="28" y="140" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      Clean feel. Sharp UX.
    </text>
    <text x="28" y="168" fill="#94A3B8" font-family="ui-monospace, Menlo, monospace" font-size="15">
      Details players notice.
    </text>
    <text x="28" y="210" fill="#E879F9" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="1">
      DESIGN · MOTION · CRAFT
    </text>
  </g>
</svg>
