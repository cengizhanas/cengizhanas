<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rail" x1="80" y1="0" x2="1120" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".33" stop-color="#A3E635"/>
      <stop offset=".66" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="20" fill="#070B14" stroke="#1F2937"/>

  <text x="600" y="42" text-anchor="middle" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="3">
    BUILD SPECTRUM
  </text>

  <path d="M90 140H1110" stroke="#1E293B" stroke-width="3"/>
  <path d="M90 140H1110" stroke="url(#rail)" stroke-width="2.5" stroke-dasharray="10 16">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace, Menlo, monospace">
    <g transform="translate(120 140)">
      <circle r="24" fill="#07151A" stroke="#22D3EE" stroke-width="2"/>
      <circle r="6" fill="#22D3EE" filter="url(#g)">
        <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="-34" y="-48" fill="#E2E8F0" font-size="15" font-weight="700">GAMES</text>
      <text x="-52" y="58" fill="#64748B" font-size="12">ARCADE / CASUAL</text>
    </g>

    <g transform="translate(360 140)">
      <circle r="24" fill="#0A1708" stroke="#A3E635" stroke-width="2"/>
      <circle r="6" fill="#A3E635" filter="url(#g)">
        <animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="-38" y="-48" fill="#E2E8F0" font-size="15" font-weight="700">MOBILE</text>
      <text x="-48" y="58" fill="#64748B" font-size="12">FLUTTER / UX</text>
    </g>

    <g transform="translate(600 140)">
      <circle r="24" fill="#120C20" stroke="#E879F9" stroke-width="2"/>
      <circle r="6" fill="#E879F9" filter="url(#g)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="-46" y="-48" fill="#E2E8F0" font-size="15" font-weight="700">BACKEND</text>
      <text x="-52" y="58" fill="#64748B" font-size="12">GO / APIs</text>
    </g>

    <g transform="translate(840 140)">
      <circle r="24" fill="#180F22" stroke="#C084FC" stroke-width="2"/>
      <circle r="6" fill="#C084FC" filter="url(#g)">
        <animate attributeName="r" values="5;8;5" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text x="-42" y="-48" fill="#E2E8F0" font-size="15" font-weight="700">TOOLS</text>
      <text x="-68" y="58" fill="#64748B" font-size="12">EXTENSIONS / AI</text>
    </g>

    <g transform="translate(1080 140)">
      <circle r="24" fill="#1A0C18" stroke="#FB7185" stroke-width="2"/>
      <circle r="6" fill="#FB7185" filter="url(#g)">
        <animate attributeName="r" values="5;8;5" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="-42" y="-48" fill="#E2E8F0" font-size="15" font-weight="700">POLISH</text>
      <text x="-58" y="58" fill="#64748B" font-size="12">FEEL / DETAIL</text>
    </g>
  </g>
</svg>
