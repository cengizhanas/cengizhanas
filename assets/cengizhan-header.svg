<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380">
    <stop stop-color="#05070D"/>
    <stop offset=".5" stop-color="#0B1020"/>
    <stop offset="1" stop-color="#05070D"/>
  </linearGradient>
  <linearGradient id="sig" x1="180" y1="0" x2="1020" y2="0">
    <stop stop-color="#22D3EE"/>
    <stop offset=".47" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#182033" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="380" rx="28" fill="url(#bg)"/>
<rect width="1200" height="380" rx="28" fill="url(#grid)" opacity=".52"/>

<circle cx="95" cy="70" r="85" fill="#8B5CF6" opacity=".07">
  <animate attributeName="r" values="65;100;65" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="1105" cy="300" r="115" fill="#22D3EE" opacity=".05">
  <animate attributeName="r" values="95;130;95" dur="8s" repeatCount="indefinite"/>
</circle>

<rect x="150" y="48" width="900" height="276" rx="22" fill="#070B14" stroke="#273149" stroke-width="2"/>
<rect x="150" y="48" width="900" height="40" rx="22" fill="#0D1322"/>
<rect x="150" y="70" width="900" height="18" fill="#0D1322"/>

<circle cx="179" cy="68" r="6" fill="#FB7185"/>
<circle cx="201" cy="68" r="6" fill="#FACC15"/>
<circle cx="223" cy="68" r="6" fill="#4ADE80"/>

<text x="600" y="74" text-anchor="middle" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="12">
