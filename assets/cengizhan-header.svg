</text>

<g transform="translate(870 112)">
  <circle cx="66" cy="66" r="58" stroke="#25314A" stroke-width="1.5"/>
  <circle cx="66" cy="66" r="43" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 8">
    <animateTransform attributeName="transform" type="rotate" from="0 66 66" to="360 66 66" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="66" r="25" fill="#8B5CF6" opacity=".12"/>
  <circle cx="66" cy="66" r="7" fill="#A78BFA" filter="url(#glow)">
    <animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="66" cy="23" r="4" fill="#22D3EE">
    <animateTransform attributeName="transform" type="rotate" from="0 66 66" to="360 66 66" dur="4.5s" repeatCount="indefinite"/>
