name: Generate contribution flow

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6
            dist/github-snake.gif?color_snake=#8B5CF6&color_dots=#0B1220,#164E63,#22D3EE,#E879F9,#FB7185
            dist/github-snake-dark.gif?palette=github-dark&color_snake=#E879F9&color_dots=#0B1220,#164E63,#22D3EE,#A78BFA,#FB7185

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
